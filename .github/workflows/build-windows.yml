name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    environment: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create .env
        run: echo "PARTYKIT_HOST=${{ secrets.PARTYKIT_HOST }}" > .env
        shell: bash

      - name: Install VLC
        run: choco install vlc -y --no-progress
        shell: powershell

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 websockets python-vlc python-dotenv pyinstaller

      - name: Build EXE
        env:
          VLC_DIR: C:\Program Files\VideoLAN\VLC
        run: |
          pyinstaller videosync-windows.spec
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: videosync-windows
          path: dist/videosync/
          retention-days: 30
