<!DOCTYPE html>
<html>
<head>
  <title>Video Sync Viewer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #1a1a2e; color: #eee; }
    h1 { text-align: center; color: #00d4ff; }
    #status { display: flex; align-items: center; gap: 10px; font-size: 18px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4444; }
    .dot.connected { background: #44ff44; }
    .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
    button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; background: #00d4ff; color: #1a1a2e; font-weight: bold; transition: transform 0.1s; }
    button:hover { transform: scale(1.05); }
    button:active { transform: scale(0.95); }
    #messages { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    .msg { padding: 5px 0; border-bottom: 1px solid #0f3460; }
    .received { color: #44ff44; }
    .sent { color: #00d4ff; }
    .sync { color: #ffaa00; }
    #videoInfo { background: #16213e; padding: 15px; border-radius: 8px; margin-top: 15px; }
    #videoInfo div { margin: 5px 0; }
    .label { color: #888; }
  </style>
</head>
<body>
  <h1>🎬 Video Sync Viewer</h1>
  <div id="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">Connecting...</span>
  </div>
  
  <div class="controls">
    <button onclick="sendCommand('play')">▶ Play</button>
    <button onclick="sendCommand('pause')">⏸ Pause</button>
    <button onclick="sendCommand('seek', 0)">⏮ Restart</button>
  </div>
  
  <div id="videoInfo">
    <div><span class="label">State:</span> <span id="state">-</span></div>
    <div><span class="label">Time:</span> <span id="time">-</span></div>
    <div><span class="label">Duration:</span> <span id="duration">-</span></div>
  </div>
  
  <div id="messages"></div>
  
  <script>
    const host = window.location.host || 'localhost:1999';
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${host}/parties/main/video-sync`);
    
    const messagesDiv = document.getElementById('messages');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const stateSpan = document.getElementById('state');
    const timeSpan = document.getElementById('time');
    const durationSpan = document.getElementById('duration');
    
    ws.onopen = () => {
      dot.classList.add('connected');
      statusText.textContent = 'Connected';
      addMessage('Connected to sync server', 'sent');
    };
    
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      if (data.type === 'sync') {
        stateSpan.textContent = data.state;
        timeSpan.textContent = data.videoTime.toFixed(1) + 's';
        durationSpan.textContent = data.duration.toFixed(1) + 's';
        addMessage(`Video: ${data.state} at ${data.videoTime.toFixed(1)}s (${data.duration.toFixed(1)}s)`, 'sync');
      } else {
        addMessage('Received: ' + JSON.stringify(data), 'received');
      }
    };
    
    ws.onclose = () => {
      dot.classList.remove('connected');
      statusText.textContent = 'Disconnected';
    };
    
    function sendCommand(type, timestamp = 0) {
      const msg = { type, timestamp };
      ws.send(JSON.stringify(msg));
      addMessage('Sent: ' + type + (timestamp ? ' @ ' + timestamp + 's' : ''), 'sent');
    }
    
    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.textContent = new Date().toLocaleTimeString() + ' ' + text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
